services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: inttec_db_local
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API REST PostgREST
  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: inttec_postgrest_local
    restart: always
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: postgres
      PGRST_JWT_SECRET: "super-secret-jwt-key-for-local-testing-at-least-32-chars-long"
      PGRST_SERVER_PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  # Nginx Reverse Proxy (para compatibilidad total con /rest/v1 de @supabase/supabase-js)
  proxy:
    image: nginx:alpine
    container_name: inttec_proxy_local
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgrest

volumes:
  postgres_data:
