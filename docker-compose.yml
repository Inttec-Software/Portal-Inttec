services:
  # Base de Datos PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: inttec_db_local
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Visualizador Web CloudBeaver (Misma interfaz de administración que en Lightsail)
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: inttec_cloudbeaver_local
    restart: always
    ports:
      - "8978:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  cloudbeaver_data:
